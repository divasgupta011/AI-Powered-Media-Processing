name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prisma client is needed before the api/worker typecheck + tests
      - run: npm run db:generate

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (worker pipeline + retry)
        run: npm test

      - name: Build web
        run: npm -w @camarin/web run build
