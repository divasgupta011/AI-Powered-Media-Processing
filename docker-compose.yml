# full system: `docker compose up`. defaults run with mock AI so no keys are
# needed. to use real AI, put values in .env (AI_MOCK=false, HUGGINGFACE_API_TOKEN,
# CAPTION_PROVIDER, and a service account at ./secrets/gcp-vision.json for Vision).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: camarin
      POSTGRES_PASSWORD: camarin
      POSTGRES_DB: camarin
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U camarin']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/media-uploads &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      DATABASE_URL: postgresql://camarin:camarin@db:5432/camarin?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: media-uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      MAX_FILE_SIZE_MB: '5'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: '7'
      CORS_ORIGIN: http://localhost:8080

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://camarin:camarin@db:5432/camarin?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: media-uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      AI_MOCK: ${AI_MOCK:-true}
      CAPTION_PROVIDER: ${CAPTION_PROVIDER:-local}
      HF_CAPTION_MODEL: ${HF_CAPTION_MODEL:-Xenova/vit-gpt2-image-captioning}
      HF_VLM_MODEL: ${HF_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      WORKER_CONCURRENCY: '5'
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
  miniodata:
